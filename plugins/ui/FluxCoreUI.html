<template id="flux-core-ui">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :host { display:block; width:100%; height:100%; background:radial-gradient(ellipse at 20% 0%, #141421 0%, #07070b 60%, #020204 100%); color:#f4f5fa; font-family:'Inter', -apple-system, sans-serif; overflow:hidden; }
  .shell { display:flex; flex-direction:column; height:100%; position:relative; }
  .shell::before { content:''; position:absolute; inset:0; background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='g' width='60' height='60' patternUnits='userSpaceOnUse'%3E%3Cpath d='M 60 0 L 0 0 0 60' fill='none' stroke='%23ffffff' stroke-opacity='0.03'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='100%25' height='100%25' fill='url(%23g)'/%3E%3C/svg%3E"); pointer-events:none; opacity:.6; }
  .header { display:flex; align-items:center; gap:18px; padding:0 28px; height:64px; border-bottom:1px solid rgba(255,255,255,.06); background:rgba(255,255,255,.02); backdrop-filter:blur(12px); position:relative; z-index:10; }
  .brand { display:flex; flex-direction:column; }
  .brand .town { font-size:11px; font-weight:800; letter-spacing:2.8px; color:#ffb800; text-transform:uppercase; }
  .brand .type { font-size:9px; font-weight:600; letter-spacing:1.2px; color:#6e6e85; text-transform:uppercase; }
  .tagline { font-size:10px; color:#6e6e85; letter-spacing:0.5px; margin-left:12px; }
  .presetbar { display:flex; gap:8px; margin-left:auto; }
  .preset { font-size:10px; font-weight:700; padding:7px 14px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:#8b8ba3; cursor:pointer; transition:all .15s; }
  .preset:hover { border-color:rgba(255,255,255,.18); color:#d4d4e0; }
  .preset.active { background:#ffb800; color:#050507; border-color:#ffb800; box-shadow:0 0 20px #ffb80050; }
  .ai-tray { display:flex; gap:10px; align-items:center; margin-left:18px; }
  .ai-btn { width:34px; height:34px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:#8b8ba3; display:grid; place-items:center; cursor:pointer; font-size:12px; font-weight:700; transition:all .15s; }
  .ai-btn.on { color:#ffb800; border-color:#ffb800; box-shadow:0 0 16px #ffb80040; background:rgba(255,255,255,.07); }
  .ai-panel { display:none; background:rgba(10,10,14,.95); border-bottom:1px solid rgba(255,255,255,.06); padding:14px 28px; position:relative; z-index:9; backdrop-filter:blur(16px); }
  .ai-panel.open { display:block; }
  .stage { flex:1; position:relative; min-height:0; z-index:1; }
  canvas.main { position:absolute; inset:0; width:100%; height:100%; }
  .readouts { position:absolute; top:22px; left:28px; display:flex; gap:14px; pointer-events:none; }
  .readout-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:12px 18px; min-width:120px; backdrop-filter:blur(8px); }
  .readout-label { font-size:8px; letter-spacing:1.4px; color:#6e6e85; text-transform:uppercase; margin-bottom:4px; }
  .readout-value { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; color:#fff; text-shadow:0 0 18px #ffb80060; }
  .footer { height:110px; background:rgba(255,255,255,.02); border-top:1px solid rgba(255,255,255,.06); backdrop-filter:blur(12px); display:grid; grid-template-columns: repeat(6, 1fr); align-items:center; padding:0 28px; gap:18px; position:relative; z-index:10; }
  .control { display:flex; flex-direction:column; gap:8px; }
  .control-top { display:flex; justify-content:space-between; align-items:center; }
  .control-name { font-size:9px; letter-spacing:1.3px; color:#6e6e85; text-transform:uppercase; font-weight:600; }
  .control-val { font-size:13px; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }
  .slider-track { position:relative; height:6px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; }
  .slider-track::before { content:''; position:absolute; left:0; top:0; bottom:0; width:var(--fill,50%); background:linear-gradient(90deg, #ffb800, #ff5e3a); border-radius:3px; }
  .control input[type=range] { position:absolute; inset:0; width:100%; height:100%; -webkit-appearance:none; background:transparent; outline:none; margin:0; }
  .control input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 0 12px #ffb800; cursor:pointer; border:2px solid #ffb800; }
  .bot-input-row { display:flex; gap:10px; align-items:center; }
  .bot-input-row input { flex:1; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:9px 12px; color:#f4f5fa; font-size:12px; outline:none; }
  .bot-input-row button { background:#ffb800; color:#050507; border:none; border-radius:8px; padding:9px 16px; font-size:11px; font-weight:800; cursor:pointer; }
  .bot-log { margin-top:10px; font-size:11px; color:#9a9ab0; max-height:80px; overflow-y:auto; }
  .driver-modes { display:flex; gap:8px; }
</style>

<div class="shell">
  <div class="header">
    <div class="brand">
      <div class="town">Tuscola</div>
      <div class="type">FluxCore</div>
    </div>
    <div class="tagline">Stem-Aware Saturation + DeReverb</div>
    <div class="presetbar"><button class="preset active" data-p="0">CLEAN ROOM</button><button class="preset" data-p="1">PUNCH DRUMS</button><button class="preset" data-p="2">WARM MIX</button><button class="preset" data-p="3">STEM GLUE</button></div>
    <div class="ai-tray">
      <button class="ai-btn on" id="driverBtn">D</button>
      <button class="ai-btn" id="botBtn">B</button>
    </div>
  </div>

  <div class="ai-panel" id="aiPanel">
    <div id="driverPanel">
      <div style="font-size:10px;letter-spacing:1.2px;color:#6e6e85;text-transform:uppercase;margin-bottom:8px;">Titan Driver â€” Tuscola</div>
      <div class="driver-modes">
        <button class="preset active" data-mode="SMART">SMART</button>
        <button class="preset" data-mode="TIGHT">TIGHT</button>
        <button class="preset" data-mode="OPEN">OPEN</button>
      </div>
    </div>
    <div id="botPanel" style="display:none;">
      <div class="bot-input-row">
        <input id="botInput" placeholder="Ask for help...">
        <button id="botSend">Send</button>
      </div>
      <div class="bot-log" id="botLog"></div>
    </div>
  </div>

  <div class="stage">
    <canvas class="main" id="mainCanvas"></canvas>
    <div class="readouts"><div class="readout-card"><div class="readout-label">De-Reverb</div><div class="readout-value" id="readout0">30%</div></div><div class="readout-card"><div class="readout-label">Saturation</div><div class="readout-value" id="readout1">45%</div></div></div>
  </div>

  <div class="footer"><div class="control">
    <div class="control-top"><span class="control-name">Vocal</span><span class="control-val">50</span></div>
    <div class="slider-track"><input type="range" min="0" max="100" value="50" data-param="param1"></div>
  </div><div class="control">
    <div class="control-top"><span class="control-name">Drum</span><span class="control-val">40</span></div>
    <div class="slider-track"><input type="range" min="0" max="100" value="40" data-param="param2"></div>
  </div><div class="control">
    <div class="control-top"><span class="control-name">Bass</span><span class="control-val">100</span></div>
    <div class="slider-track"><input type="range" min="0" max="100" value="100" data-param="param3"></div>
  </div><div class="control">
    <div class="control-top"><span class="control-name">Other</span><span class="control-val">50</span></div>
    <div class="slider-track"><input type="range" min="0" max="100" value="50" data-param="param4"></div>
  </div><div class="control">
    <div class="control-top"><span class="control-name">De-Reverb</span><span class="control-val">50</span></div>
    <div class="slider-track"><input type="range" min="0" max="100" value="50" data-param="param5"></div>
  </div><div class="control">
    <div class="control-top"><span class="control-name">Saturation</span><span class="control-val">50</span></div>
    <div class="slider-track"><input type="range" min="0" max="100" value="50" data-param="param6"></div>
  </div></div>
</div>
</template>

<script>
(function () {
  const U = window.TitanUIUtils;
  const PRESETS = [{"name":"CLEAN ROOM","color":"#ffb800"},{"name":"PUNCH DRUMS","color":"#ffb800"},{"name":"WARM MIX","color":"#ffb800"},{"name":"STEM GLUE","color":"#ffb800"}];
  class TuscolaUI extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({mode:'open'});
      this.shadowRoot.appendChild(document.getElementById('flux-core-ui').content.cloneNode(true));
      this._p = {};
      for(let i=1;i<=6;i++) this._p['param'+i] = (i===2?40:(i===3?100:50));
      this._preset = 0;
      this._aiOpen = false; this._aiTab = 'driver';
    }
    connectedCallback() { this._bindControls(); this._bindPresets(); this._bindAI(); this._startMain(); }
    _set(id,v){
      this._p[id] = U.clamp(v,0,100);
      const f=this.shadowRoot.querySelector('.control input[data-param="'+id+'"]');
      if(f){ f.value=this._p[id]; f.parentElement.style.setProperty('--fill', this._p[id]+'%'); f.closest('.control').querySelector('.control-val').textContent=Math.round(this._p[id]); }
      U.dispatchParamChange(this,id,this._p[id]);
    }
    _bindControls(){
      this.shadowRoot.querySelectorAll('.control input').forEach(inp=>{
        const id=inp.dataset.param;
        inp.parentElement.style.setProperty('--fill', this._p[id]+'%');
        inp.addEventListener('input',()=>this._set(id,parseFloat(inp.value)));
      });
    }
    _bindPresets(){
      this.shadowRoot.querySelectorAll('.preset[data-p]').forEach(pill=>{
        pill.addEventListener('click',()=>{
          this.shadowRoot.querySelectorAll('.preset[data-p]').forEach(x=>x.classList.remove('active'));
          pill.classList.add('active');
          this._preset = parseInt(pill.dataset.p);
        });
      });
    }
    _bindAI(){
      const driverBtn=this.shadowRoot.getElementById('driverBtn');
      const botBtn=this.shadowRoot.getElementById('botBtn');
      const panel=this.shadowRoot.getElementById('aiPanel');
      const driverPanel=this.shadowRoot.getElementById('driverPanel');
      const botPanel=this.shadowRoot.getElementById('botPanel');
      const toggle=(tab)=>{
        if(this._aiOpen && this._aiTab===tab){ this._aiOpen=false; panel.classList.remove('open'); driverBtn.classList.remove('on'); botBtn.classList.remove('on'); return; }
        this._aiOpen=true; this._aiTab=tab;
        panel.classList.add('open');
        driverPanel.style.display=tab==='driver'?'block':'none';
        botPanel.style.display=tab==='bot'?'block':'none';
        driverBtn.classList.toggle('on',tab==='driver');
        botBtn.classList.toggle('on',tab==='bot');
      };
      driverBtn.addEventListener('click',()=>toggle('driver'));
      botBtn.addEventListener('click',()=>toggle('bot'));
      this.shadowRoot.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
        this.shadowRoot.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      }));
      this.shadowRoot.getElementById('botSend').addEventListener('click',()=>this._botReply());
      this.shadowRoot.getElementById('botInput').addEventListener('keydown',e=>{ if(e.key==='Enter') this._botReply(); });
    }
    _botReply(){
      const inp=this.shadowRoot.getElementById('botInput');
      const log=this.shadowRoot.getElementById('botLog');
      const t=inp.value.trim(); if(!t) return;
      const runtime=window.TitanDriverRuntime;
      const esc=runtime?.escapeHtml || ((value)=>String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'));
      log.innerHTML += '<div style="color:#f4f5fa;">You: '+esc(t)+'</div>';
      const params={};
      this.shadowRoot.querySelectorAll('[data-param]').forEach(el=>{ params[el.dataset.param]=el.value; });
      const activeMode=this.shadowRoot.querySelector('[data-mode].active')?.dataset.mode || 'SMART';
      const pluginName=this.tagName.toLowerCase().replace(/-/g,' ');
      const answer=runtime?.answer(t,{pluginName,botName:pluginName+' bot',driverName:'Titan Plugin Driver',mode:activeMode,params});
      let r=answer?.response || 'Try a preset or adjust the parameters in the footer.';
      log.innerHTML += '<div style="color:#ffb800;">Tuscola: '+esc(r)+'</div>';
      inp.value='';
    }
    _startMain(){
      const cvs=this.shadowRoot.getElementById('mainCanvas');
      let t=0;
      const draw=()=>{
        const ctx=cvs.getContext('2d');
        const rect=cvs.getBoundingClientRect();
        cvs.width=rect.width*(window.devicePixelRatio||1);
        cvs.height=rect.height*(window.devicePixelRatio||1);
        ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
        const W=rect.width, H=rect.height;
        t+=0.015;
        ctx.fillStyle='#07070b'; ctx.fillRect(0,0,W,H);
        const COL='#ffb800'; const COL2='#ff5e3a';
        
      const stems=['VOCAL','DRUM','BASS','OTHER']; const cx=W*0.5, cy=H*0.5, r=Math.min(W,H)*0.25;
      // central core glow
      const core=ctx.createRadialGradient(cx,cy,5,cx,cy,r*1.3); core.addColorStop(0,COL+'80'); core.addColorStop(1,'transparent');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(cx,cy,r*1.3,0,Math.PI*2); ctx.fill();
      // stem orbit rings
      ctx.strokeStyle='#ffffff15'; ctx.lineWidth=1;
      for(let i=1;i<=4;i++){ ctx.beginPath(); ctx.arc(cx,cy,r*(0.4+i*0.2),0,Math.PI*2); ctx.stroke(); }
      stems.forEach((s,i)=>{
        const a=(i/stems.length)*Math.PI*2 - Math.PI/2 + t*0.15;
        const val=(this._p['param'+(i+1)]||50)/100;
        const rr=r*(0.6+val*0.4);
        const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
        // stem node glow
        const g=ctx.createRadialGradient(x,y,2,x,y,28); g.addColorStop(0,COL); g.addColorStop(1,'transparent');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,28,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font='700 11px Inter'; ctx.textAlign='center'; ctx.fillText(s, cx+Math.cos(a)*r*1.22, cy+Math.sin(a)*r*1.22);
      });
      this.shadowRoot.querySelector('#readout0').textContent=Math.round(this._p.param5)+'%';
      this.shadowRoot.querySelector('#readout1').textContent=Math.round(this._p.param6)+'%';
    
        requestAnimationFrame(draw);
      };
      draw();
      U.observeResize(this.shadowRoot.host,()=>{});
    }
  }
  if(!customElements.get('flux-core-ui')) customElements.define('flux-core-ui',TuscolaUI);
})();
</script>
