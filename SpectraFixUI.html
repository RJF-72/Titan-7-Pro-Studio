<!-- SpectraFixUI.html -->
<template id="spectra-fix-ui">
  <style>
    :host {
      display: grid;
      grid-template-rows: 1fr 120px;
      background: var(--titan-bg-dark, #0F0F12);
      height: 100%; width: 100%;
      font-family: 'Inter', sans-serif;
    }
    
    /* Main Spectrogram View */
    .spectrogram-container {
      position: relative; width: 100%; height: 100%;
      background: #0A0A0C; overflow: hidden;
    }
    #spectrogramCanvas { width: 100%; height: 100%; }
    
    /* Heatmap Overlay for Auto-Detected Clicks */
    .heatmap-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; mix-blend-mode: screen;
    }
    .detected-click {
      position: absolute; background: rgba(255, 51, 102, 0.6);
      border: 1px solid #FF3366; border-radius: 4px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 0.8; } 100% { opacity: 0.4; } }

    /* Brush / Selection Tools */
    .toolbar {
      position: absolute; top: 10px; left: 10px;
      display: flex; gap: 8px; background: rgba(20,20,24,0.9);
      padding: 6px; border-radius: 6px; border: 1px solid #333;
    }
    .tool-btn {
      width: 32px; height: 32px; border: none; background: transparent;
      color: #888; border-radius: 4px; cursor: pointer; font-size: 16px;
    }
    .tool-btn.active { background: #00E5FF; color: #000; }

    /* A/B Comparison Slider */
    .ab-slider-container {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 200px; height: 30px; background: #1A1A1E; border-radius: 15px;
      display: flex; align-items: center; padding: 0 15px; cursor: ew-resize;
      border: 1px solid #333;
    }
    .ab-thumb {
      width: 24px; height: 24px; background: #EAEAEA; border-radius: 50%;
      position: absolute; left: 50%; transform: translateX(-50%);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* Bottom Controls */
    .controls-panel {
      display: flex; justify-content: space-around; align-items: center;
      padding: 15px 20px; background: #151518; border-top: 1px solid #2A2A2E;
    }
  </style>

  <div class="spectrogram-container">
    <canvas id="spectrogramCanvas"></canvas>
    <div class="heatmap-overlay" id="heatmapOverlay"></div>
    
    <div class="toolbar">
      <button class="tool-btn active" title="Brush Select">🖌️</button>
      <button class="tool-btn" title="Circle Select">⭕</button>
      <button class="tool-btn" title="Auto-Detect" id="autoDetectBtn">✨</button>
    </div>

    <div class="ab-slider-container" id="abSlider">
      <span style="font-size:10px; color:#888; position:absolute; left:10px;">A (Dry)</span>
      <span style="font-size:10px; color:#888; position:absolute; right:10px;">B (Healed)</span>
      <div class="ab-thumb" style="left: 100%"></div> <!-- Default to 100% B (Healed) -->
    </div>
  </div>

  <div class="controls-panel">
    <div class="control-group">
      <span class="control-label">Sensitivity</span>
      <div class="titan-knob" data-param="DetectionThreshold" style="--value: 65"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Max Duration</span>
      <div class="titan-knob" data-param="MaxAnomalyDurationMs" style="--value: 50"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Inpaint Radius</span>
      <div class="titan-knob" data-param="InpaintingRadius" style="--value: 3"></div>
    </div>
  </div>
</template>

<script>
  class SpectraFixUI extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(document.getElementById('spectra-fix-ui').content.cloneNode(true));
      this.initSpectrogram();
      this.bindRDSLListener();
    }

    initSpectrogram() {
      // WebGL-based spectrogram renderer. 
      // Reads magnitude data from Titan Shared Memory and renders as a color-mapped texture at 60fps.
    }

    bindRDSLListener() {
      window.addEventListener('titan-rdsl-update', (e) => {
        if (e.detail.plugin === 'spectrafix') {
          if (e.detail.action === 'remove_mouth_clicks') {
            this.animateKnob('DetectionThreshold', 65);
            this.animateKnob('MaxAnomalyDurationMs', 50);
            this.triggerAutoScan();
            this.showFeedback("SpectraFix: Auto-detecting and inpainting transient anomalies <50ms (mouth clicks/pops).");
          }
        }
      });
    }

    triggerAutoScan() {
      // Highlights the auto-detect button and flashes the heatmap overlay
      const btn = this.shadowRoot.getElementById('autoDetectBtn');
      btn.classList.add('active');
      setTimeout(() => btn.classList.remove('active'), 2000);
    }
  }
  customElements.define('spectra-fix-ui', SpectraFixUI);
</script>
