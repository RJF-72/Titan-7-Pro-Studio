<!-- PhaseLockUI.html -->
<template id="phase-lock-ui">
  <style>
    :host {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 140px;
      background: var(--titan-bg-dark, #0F0F12);
      height: 100%; width: 100%;
      font-family: 'Inter', sans-serif;
    }
    
    /* Real-Time Goniometer */
    .goniometer-container {
      grid-row: 1 / 3;
      background: #0A0A0C;
      border-right: 1px solid #2A2A2E;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    #goniometerCanvas { width: 90%; height: 90%; }
    
    /* Mono Compatibility Warning Overlay */
    .mono-warning {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: #FF3366; color: white; padding: 6px 16px;
      border-radius: 4px; font-weight: 700; font-size: 12px; letter-spacing: 1px;
      display: none; animation: flash 0.5s infinite alternate;
    }
    @keyframes flash { from { opacity: 0.6; } to { opacity: 1.0; } }

    /* Right Panel: Correlation & Width Graph */
    .analysis-panel {
      display: flex; flex-direction: column;
      border-bottom: 1px solid #2A2A2E;
    }
    .correlation-meter {
      height: 60px; background: #151518; display: flex; align-items: center;
      padding: 0 20px; position: relative;
    }
    .corr-bar-bg {
      width: 100%; height: 12px; background: #0A0A0C; border-radius: 6px;
      position: relative; overflow: hidden;
    }
    .corr-bar-fill {
      height: 100%; width: 50%; /* Starts at center (0.0) */
      background: linear-gradient(90deg, #FF3366 0%, #F5A623 40%, #00FF94 50%, #F5A623 60%, #FF3366 100%);
      transition: width 0.1s linear;
    }
    .corr-marker {
      position: absolute; top: -4px; width: 4px; height: 20px;
      background: #EAEAEA; border-radius: 2px;
      left: 50%; transform: translateX(-50%);
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    .width-graph-container {
      flex: 1; background: #121215; position: relative;
    }
    #widthGraphCanvas { width: 100%; height: 100%; }

    /* Bottom Controls */
    .controls-panel {
      grid-column: 2; grid-row: 2;
      display: flex; justify-content: space-around; align-items: center;
      padding: 15px; background: #1A1A1E;
    }
    .control-group { display: flex; flex-direction: column; align-items: center; }
    .control-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
  </style>

  <!-- Goniometer -->
  <div class="goniometer-container">
    <canvas id="goniometerCanvas"></canvas>
    <div class="mono-warning" id="monoWarning">⚠️ PHASE CANCELLATION RISK</div>
  </div>

  <!-- Analysis -->
  <div class="analysis-panel">
    <div class="correlation-meter">
      <span style="font-size:10px; color:#FF3366; margin-right:10px;">-1 (OUT)</span>
      <div class="corr-bar-bg">
        <div class="corr-bar-fill" id="corrFill" style="left: 50%; width: 0%;"></div>
        <div class="corr-marker" id="corrMarker" style="left: 85%;"></div> <!-- Example: +0.7 -->
      </div>
      <span style="font-size:10px; color:#FF3366; margin-left:10px;">+1 (IN)</span>
    </div>
    <div class="width-graph-container">
      <canvas id="widthGraphCanvas"></canvas>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-panel">
    <div class="control-group">
      <span class="control-label">Global Width</span>
      <div class="titan-knob" data-param="GlobalWidth" style="--value: 50"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Mono Fold (Hz)</span>
      <div class="titan-knob" data-param="LowCutFrequency" style="--value: 25"></div> <!-- 120Hz -->
    </div>
    <div class="control-group">
      <span class="control-label">High Width</span>
      <div class="titan-knob" data-param="HighShelfWidth" style="--value: 30"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Mid Level</span>
      <div class="titan-knob" data-param="MidLevel" style="--value: 50"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Side Level</span>
      <div class="titan-knob" data-param="SideLevel" style="--value: 50"></div>
    </div>
  </div>
</template>

<script>
  class PhaseLockUI extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(document.getElementById('phase-lock-ui').content.cloneNode(true));
      this.initGoniometer();
      this.initWidthGraph();
      this.bindRDSLListener();
    }

    initGoniometer() {
      // WebGL/Canvas 2D Lissajous figure renderer.
      // Plots L vs R in real-time. Draws a "Safe Zone" cone in the center.
    }

    bindRDSLListener() {
      window.addEventListener('titan-rdsl-update', (e) => {
        if (e.detail.plugin === 'phaselock') {
          if (e.detail.action === 'widen_guitars_mono_safe') {
            this.animateKnob('GlobalWidth', 67); // 1.35
            this.animateKnob('LowCutFrequency', 25); // 120Hz
            this.animateKnob('HighShelfWidth', 60);
            this.showFeedback("PhaseLock: Guitars widened. Sub-bass forced to mono, high-shelf width applied.");
          }
        }
      });

      // Listen for real-time correlation updates
      window.addEventListener('titan-phaselock-correlation', (e) => {
        const corr = e.detail.value; // -1.0 to 1.0
        const percent = ((corr + 1.0) / 2.0) * 100; // 0% to 100%
        this.shadowRoot.getElementById('corrMarker').style.left = `${percent}%`;
        
        const warning = this.shadowRoot.getElementById('monoWarning');
        warning.style.display = corr < 0.0 ? 'block' : 'none';
      });
    }
  }
  customElements.define('phase-lock-ui', PhaseLockUI);
</script>
