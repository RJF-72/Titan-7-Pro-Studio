<!-- AuraMorphUI.html -->
<template id="aura-morph-ui">
  <style>
    :host {
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: 1fr 120px;
      width: 100%; height: 100%;
      background: var(--titan-bg-dark, #121214);
      color: var(--titan-text-primary, #EAEAEA);
      font-family: 'Inter', sans-serif;
    }
    .capsule-viewer { grid-row: 1 / 3; background: #1A1A1D; border-right: 1px solid #333; }
    .freq-graph { grid-column: 2; height: 100%; position: relative; }
    .controls { grid-column: 2; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; }
    
    /* SOTA Vector Knobs using CSS Conic Gradients */
    .titan-knob {
      width: 60px; height: 60px; border-radius: 50%;
      background: conic-gradient(var(--titan-accent, #00E5FF) calc(var(--value) * 1%), #333 0);
      position: relative; cursor: ns-resize;
    }
    .titan-knob::after {
      content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #1A1A1D;
    }
  </style>

  <!-- 1. 3D Interactive Capsule (Three.js / WebGL) -->
  <div class="capsule-viewer" id="webgl-container">
    <!-- Renders real-time 3D mic capsule with dynamic glow based on 'driveAmount' -->
  </div>

  <!-- 2. Real-Time Frequency Response Comparison -->
  <canvas class="freq-graph" id="freqCanvas"></canvas>

  <!-- 3. Drag-and-Drop Target Mic Selector -->
  <div class="controls">
    <div class="mic-selector" draggable="true" data-mic="c800g">
      <span class="mic-name">Modern Air</span>
      <div class="match-ring" style="--match: 94%">94% Match</div>
    </div>
    
    <!-- Vector Knobs -->
    <div class="titan-knob" data-param="driveAmount" style="--value: 35"></div>
    <div class="titan-knob" data-param="proximityBoost" style="--value: 60"></div>
    <div class="titan-knob" data-param="dryWetMix" style="--value: 100"></div>
  </div>
</template>

<script>
  // AuraMorphUI.js
  class AuraMorphUI extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(document.getElementById('aura-morph-ui').content.cloneNode(true));
      this.initWebGLCapsule();
      this.initFreqGraph();
      this.bindRDSLListener();
    }

    initWebGLCapsule() {
      // Initializes Three.js scene with a physically based rendered (PBR) microphone capsule.
      // Listens to 'driveAmount' param to increase emissive glow on the tube element.
    }

    bindRDSLListener() {
      // Listens for RDSL Bot JSON payloads to animate UI
      window.addEventListener('titan-rdsl-update', (e) => {
        if (e.detail.plugin === 'aura_morph') {
          this.animateKnobTo(e.detail.param, e.detail.value);
          if (e.detail.param === 'TargetMicProfile') {
            this.triggerCapsuleMorphAnimation(e.detail.value);
          }
        }
      });
    }
  }
  customElements.define('aura-morph-ui', AuraMorphUI);
</script>
