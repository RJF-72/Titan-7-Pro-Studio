<!-- DeepRoomUI.html -->
<template id="deep-room-ui">
  <style>
    :host {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 140px;
      background: var(--titan-bg-dark, #0F0F12);
      height: 100%; width: 100%;
      font-family: 'Inter', sans-serif;
    }
    
    /* 3D Room Visualizer (WebGL) */
    .room-visualizer {
      grid-row: 1 / 3;
      background: #0A0A0C;
      border-right: 1px solid #2A2A2E;
      position: relative;
    }
    #webglRoomCanvas { width: 100%; height: 100%; }
    .generation-status {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.7); color: #00E5FF;
      padding: 4px 8px; border-radius: 4px; font-size: 11px;
      display: none; /* Shown via JS during async IR generation */
    }

    /* Right Panel: ER Matrix & Spectrum */
    .acoustic-panel {
      display: flex; flex-direction: column;
      border-bottom: 1px solid #2A2A2E;
    }
    .er-matrix-container {
      flex: 1; background: #151518; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    #erMatrixCanvas { width: 90%; height: 80%; }
    
    .spectrum-container {
      height: 100px; background: #121215;
      border-top: 1px solid #2A2A2E;
    }
    #decaySpectrumCanvas { width: 100%; height: 100%; }

    /* Bottom Controls */
    .controls-panel {
      grid-column: 2; grid-row: 2;
      display: flex; justify-content: space-around; align-items: center;
      padding: 15px; background: #1A1A1E;
    }
    .control-group { display: flex; flex-direction: column; align-items: center; }
    .control-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
  </style>

  <!-- 3D Room -->
  <div class="room-visualizer">
    <canvas id="webglRoomCanvas"></canvas>
    <div class="generation-status" id="genStatus">🧠 NEURAL DIFFUSION: GENERATING IR...</div>
  </div>

  <!-- ER Matrix -->
  <div class="acoustic-panel">
    <div class="er-matrix-container">
      <span style="position:absolute; top:10px; left:10px; font-size:10px; color:#00E5FF;">EARLY REFLECTIONS (ms)</span>
      <canvas id="erMatrixCanvas"></canvas>
    </div>
    <!-- Decay Tail Spectrum -->
    <div class="spectrum-container">
      <canvas id="decaySpectrumCanvas"></canvas>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-panel">
    <div class="control-group">
      <span class="control-label">Room Size</span>
      <div class="titan-knob" data-param="RoomSize" style="--value: 50"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Decay Time</span>
      <div class="titan-knob" data-param="DecayTime" style="--value: 40"></div>
    </div>
    <div class="control-group">
      <span class="control-label">ER Density</span>
      <div class="titan-knob" data-param="ERDensity" style="--value: 60"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Modulation</span>
      <div class="titan-knob" data-param="ModulationDepth" style="--value: 25"></div>
    </div>
    <div class="control-group">
      <span class="control-label">Ducking</span>
      <div class="titan-knob" data-param="DuckingAmount" style="--value: 30"></div>
    </div>
  </div>
</template>

<script>
  class DeepRoomUI extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(document.getElementById('deep-room-ui').content.cloneNode(true));
      this.initWebGLRoom();
      this.initERMatrix();
      this.bindRDSLListener();
    }

    initWebGLRoom() {
      // Three.js scene rendering a wireframe 3D room. 
      // Dimensions dynamically scale based on 'RoomSize' param.
      // Material colors shift based on 'DecayTime' (e.g., wood = warm, concrete = cool).
    }

    bindRDSLListener() {
      window.addEventListener('titan-rdsl-update', (e) => {
        if (e.detail.plugin === 'deeproom') {
          if (e.detail.action === 'small_wooden_bright') {
            this.showGenerationStatus(true);
            this.animateKnob('RoomSize', 30);
            this.animateKnob('DecayTime', 40);
            this.animateKnob('ERDensity', 70);
            this.animateKnob('HighShelfBoost', 60);
            
            requestAnimationFrame(() => {
              this.showGenerationStatus(false);
              this.showFeedback("DeepRoom: Applied small wooden room IR settings. ER density increased, high-shelf boost applied for brightness.");
            });
          }
        }
      });
    }

    showGenerationStatus(show) {
      this.shadowRoot.getElementById('genStatus').style.display = show ? 'block' : 'none';
    }
  }
  customElements.define('deep-room-ui', DeepRoomUI);
</script>
